services:
  mongodb:
    image: mongo:9.0.2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); }
          catch (error) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]});
            quit(1);
          }
          if (!db.hello().isWritablePrimary) quit(1);
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongodb_data:
