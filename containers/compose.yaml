services:
  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo

  alloy:
    image: grafana/alloy:v1.21.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    ports:
      - "127.0.0.1:12345:12345"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - type: bind
        source: ../logs
        target: /var/log/backend
        read_only: true
        bind:
          create_host_path: false
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started

  mongodb:
    image: mongo:9.0.2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); }
          catch (error) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]});
            quit(1);
          }
          if (!db.hello().isWritablePrimary) quit(1);
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  grafana_data:
  mongodb_data:
  prometheus_data:
  loki_data:
  alloy_data:
  tempo_data:

secrets:
  metrics_token:
    environment: METRICS_TOKEN
