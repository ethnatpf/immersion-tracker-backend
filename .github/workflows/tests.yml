name: Tests

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run test suites
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:9.0.2
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"try { rs.status(); } catch (error) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); quit(1); } if (!db.hello().isWritablePrimary) quit(1);\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_TEST_URL: mongodb://localhost:27017/immersion-tracker-test
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run all test suites
        run: bun run test:all
